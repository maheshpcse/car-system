<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aurora Motors — Digital Automotive Studio</title>
    <meta
      name="description"
      content="Discover, inspect, configure and virtually experience vehicles in an interactive 3D automotive showroom."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8F2D8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1E272E" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aurora Motors — Digital Automotive Studio" />
    <meta
      property="og:description"
      content="An elegant digital automotive studio where you can discover, inspect, configure and virtually experience cars in 3D."
    />
    <meta property="og:image" content="./og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    />
    <script>
      // Apply the persisted (or system) theme before first paint to avoid a flash.
      try {
        var stored = (localStorage.getItem('aurora.theme') || '').replace(/"/g, '');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
